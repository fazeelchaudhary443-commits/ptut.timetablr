<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timetable — PTUT Hub</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:#f8fafc;
  color:#0f172a;
}

.topbar{
  height:70px;
  background:#ffffff;
  border-bottom:1px solid #e2e8f0;
  display:flex;
  align-items:center;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#2563eb;
}

.back{
  margin-left:auto;
  text-decoration:none;
  color:#475569;
  font-weight:600;
}

.back:hover{
  color:#2563eb;
}

.container{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
}

.header{
  margin-bottom:28px;
}

.header h1{
  font-size:32px;
  margin-bottom:8px;
}

.header p{
  color:#64748b;
}

.card{
  background:#ffffff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:24px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th{
  background:#f1f5f9;
  padding:15px;
  text-align:left;
  font-size:14px;
}

td{
  padding:18px 15px;
  border-bottom:1px solid #e2e8f0;
  color:#475569;
}

td:first-child{
  font-weight:700;
  color:#0f172a;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#64748b;
}

@media(max-width:650px){

  .topbar{
    padding:0 18px;
  }

  .container{
    margin:25px auto;
  }

  .header h1{
    font-size:27px;
  }

}
</style>
</head>

<body>

<header class="topbar">

  <div class="logo">
    PTUT Hub
  </div>

  <a href="dashboard.html" class="back">
    ← Dashboard
  </a>

</header>

<main class="container">

  <div class="header">

    <h1>My Timetable</h1>

    <p>
      Your weekly class schedule will appear here.
    </p>

  </div>

  <div class="card">

    <table>

      <thead>
        <tr>
          <th>Day</th>
          <th>Time</th>
          <th>Subject</th>
          <th>Teacher</th>
          <th>Room</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td>Monday</td>
          <td>09:00 – 10:00</td>
          <td>Coming Soon</td>
          <td>—</td>
          <td>—</td>
        </tr>

        <tr>
          <td>Tuesday</td>
          <td>—</td>
          <td>Coming Soon</td>
          <td>—</td>
          <td>—</td>
        </tr>

        <tr>
          <td>Wednesday</td>
          <td>—</td>
          <td>Coming Soon</td>
          <td>—</td>
          <td>—</td>
        </tr>

        <tr>
          <td>Thursday</td>
          <td>—</td>
          <td>Coming Soon</td>
          <td>—</td>
          <td>—</td>
        </tr>

        <tr>
          <td>Friday</td>
          <td>—</td>
          <td>Coming Soon</td>
          <td>—</td>
          <td>—</td>
        </tr>

      </tbody>

    </table>

  </div>

</main>

</body>
</html>
