<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTUT Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* NAVBAR */
    nav {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(11,18,32,.95);
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #22d3ee;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 20px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: white;
      border: 1px solid rgba(255,255,255,.2);
    }

    .btn-primary {
      background: #22d3ee;
      color: #061018;
    }

    /* LANDING */
    .landing {
      min-height: calc(100vh - 75px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .hero {
      max-width: 850px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 50px;
      background: rgba(34,211,238,.1);
      color: #22d3ee;
      font-size: 14px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1;
      margin-bottom: 25px;
    }

    .hero p {
      color: #94a3b8;
      font-size: 19px;
      line-height: 1.7;
      max-width: 650px;
      margin: auto;
    }

    .hero-buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* AUTH */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at top, rgba(34,211,238,.12), transparent 40%),
        #0b1220;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #111b2e;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .back {
      background: transparent;
      border: 0;
      color: #94a3b8;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .auth-card h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid #26354d;
      background: #0b1220;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 3px rgba(34,211,238,.08);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #22d3ee;
      font-size: 12px;
    }

    .auth-submit {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #22d3ee;
      color: #061018;
      font-weight: 800;
    }

    .auth-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .switch-auth {
      text-align: center;
      margin-top: 22px;
      color: #94a3b8;
      font-size: 14px;
    }

    .switch-auth button {
      background: none;
      border: 0;
      color: #22d3ee;
      font-weight: 700;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: rgba(239,68,68,.1);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,.2);
    }

    .message.success {
      display: block;
      background: rgba(34,197,94,.1);
      color: #86efac;
      border: 1px solid rgba(34,197,94,.2);
    }

    /* SUCCESS */
    .success-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
    }

    .success-card {
      max-width: 500px;
      background: #111b2e;
      border: 1px solid rgba(255,255,255,.08);
      padding: 45px 30px;
      border-radius: 20px;
    }

    .success-icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    .success-card h2 {
      margin-bottom: 12px;
    }

    .success-card p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    @media(max-width:600px) {
      nav {
        padding: 0 20px;
      }

      .nav-buttons .btn-outline {
        display: none;
      }

      .auth-card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://owiakeoybapbrfrmhcik.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KxTVXqabaSm4BXRzqtUAeA_FHt8MPf-";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* =========================================
       APP
    ========================================= */

    const app = document.getElementById("app");


    function landingPage() {

      app.innerHTML = `

        <nav>
          <div class="logo">
            PTUT <span>Hub</span>
          </div>

          <div class="nav-buttons">
            <button class="btn btn-outline" onclick="showLogin()">
              Login
            </button>

            <button class="btn btn-primary" onclick="showSignup()">
              Get Started
            </button>
          </div>
        </nav>

        <main class="landing">

          <section class="hero">

            <div class="badge">
              🎓 Built for PTUT Students
            </div>

            <h1>
              Your academic life,
              <br>
              <span style="color:#22d3ee;">organized.</span>
            </h1>

            <p>
              PTUT Hub brings your timetable, tasks, exams
              and university announcements together in one
              simple student platform.
            </p>

            <div class="hero-buttons">

              <button class="btn btn-primary"
                      onclick="showSignup()">
                Create Account →
              </button>

              <button class="btn btn-outline"
                      onclick="showLogin()">
                Login
              </button>

            </div>

          </section>

        </main>
      `;
    }


    /* =========================================
       LOGIN
    ========================================= */

    function showLogin() {

      app.innerHTML = `

        <div class="auth-page">

          <div class="auth-card">

            <button class="back" onclick="landingPage()">
              ← Back to PTUT Hub
            </button>

            <h2>Welcome back 👋</h2>

            <p class="auth-subtitle">
              Login to your PTUT Hub account.
            </p>

            <div id="message" class="message"></div>

            <form id="loginForm">

              <div class="form-group">

                <label>Email</label>

                <input
                  id="loginEmail"
                  type="email"
                  placeholder="your@email.com"
                  required
                >

              </div>


              <div class="form-group">

                <label>Password</label>

                <div class="password-wrap">

                  <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter your password"
                    required
                  >

                  <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('loginPassword', this)">
                    Show
                  </button>

                </div>

              </div>


              <button
                id="loginButton"
                class="auth-submit"
                type="submit">

                Login

              </button>

            </form>


            <div class="switch-auth">

              Don't have an account?

              <button onclick="showSignup()">
                Create one
              </button>

            </div>

          </div>

        </div>
      `;


      document
        .getElementById("loginForm")
        .addEventListener("submit", loginUser);
    }


    async function loginUser(e) {

      e.preventDefault();

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const button =
        document.getElementById("loginButton");

      button.disabled = true;
      button.textContent = "Logging in...";

      clearMessage();

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        showMessage(
          getFriendlyError(error.message),
          "error"
        );

        button.disabled = false;
        button.textContent = "Login";

        return;
      }


      if (data.user) {

        showSuccess(
          "Login successful! 🎉",
          "Your PTUT Hub account is ready. Dashboard will be connected next."
        );

      }

    }


    /* =========================================
       SIGNUP
    ========================================= */

    function showSignup() {

      app.innerHTML = `

        <div class="auth-page">

          <div class="auth-card">

            <button class="back" onclick="landingPage()">
              ← Back to PTUT Hub
            </button>

            <h2>Create account 🚀</h2>

            <p class="auth-subtitle">
              Join PTUT Hub and organize your university life.
            </p>

            <div id="message" class="message"></div>

            <form id="signupForm">


              <div class="form-group">

                <label>Full Name</label>

                <input
                  id="signupName"
                  type="text"
                  placeholder="Your full name"
                  required
                >

              </div>


              <div class="form-group">

                <label>Email</label>

                <input
                  id="signupEmail"
                  type="email"
                  placeholder="your@email.com"
                  required
                >

              </div>


              <div class="form-group">

                <label>Password</label>

                <div class="password-wrap">

                  <input
                    id="signupPassword"
                    type="password"
                    placeholder="Minimum 8 characters"
                    required
                  >

                  <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('signupPassword', this)">
                    Show
                  </button>

                </div>

              </div>


              <div class="form-group">

                <label>Confirm Password</label>

                <div class="password-wrap">

                  <input
                    id="signupConfirm"
                    type="password"
                    placeholder="Repeat your password"
                    required
                  >

                  <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('signupConfirm', this)">
                    Show
                  </button>

                </div>

              </div>


              <button
                id="signupButton"
                class="auth-submit"
                type="submit">

                Create Account

              </button>

            </form>


            <div class="switch-auth">

              Already have an account?

              <button onclick="showLogin()">
                Login
              </button>

            </div>

          </div>

        </div>
      `;


      document
        .getElementById("signupForm")
        .addEventListener("submit", signupUser);
    }


    async function signupUser(e) {

      e.preventDefault();

      const name =
        document.getElementById("signupName").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const confirm =
        document.getElementById("signupConfirm").value;

      const button =
        document.getElementById("signupButton");


      clearMessage();


      /* VALIDATION */

      if (name.length < 2) {

        showMessage(
          "Please enter your full name.",
          "error"
        );

        return;
      }


      if (password.length < 8) {

        showMessage(
          "Password must be at least 8 characters.",
          "error"
        );

        return;
      }


      if (password !== confirm) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent = "Creating account...";


      /* SUPABASE SIGNUP */

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            }

          }

        });


      if (error) {

        showMessage(
          getFriendlyError(error.message),
          "error"
        );

        button.disabled = false;
        button.textContent = "Create Account";

        return;
      }


      /* SUCCESS */

      if (data.user) {

        if (data.session) {

          showSuccess(
            "Account created! 🎉",
            "Your PTUT Hub account has been created successfully."
          );

        } else {

          showSuccess(
            "Account created! 📧",
            "We have created your account. Please check your email and verify your account before logging in."
          );

        }

      }

    }


    /* =========================================
       SUCCESS SCREEN
    ========================================= */

    function showSuccess(title, text) {

      app.innerHTML = `

        <div class="success-page">

          <div class="success-card">

            <div class="success-icon">
              ✅
            </div>

            <h2>${title}</h2>

            <p>
              ${text}
            </p>

            <button
              class="btn btn-primary"
              onclick="showLogin()">

              Continue to Login

            </button>

          </div>

        </div>

      `;
    }


    /* =========================================
       PASSWORD
    ========================================= */

    function togglePassword(id, button) {

      const input =
        document.getElementById(id);

      if (input.type === "password") {

        input.type = "text";
        button.textContent = "Hide";

      } else {

        input.type = "password";
        button.textContent = "Show";

      }

    }


    /* =========================================
       MESSAGES
    ========================================= */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      if (!message) return;

      message.className =
        "message " + type;

      message.textContent = text;

    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      if (!message) return;

      message.className = "message";
      message.textContent = "";

    }


    /* =========================================
       FRIENDLY ERRORS
    ========================================= */

    function getFriendlyError(error) {

      const msg = error.toLowerCase();


      if (msg.includes("invalid login credentials")) {
        return "Email or password is incorrect.";
      }


      if (msg.includes("user already registered")) {
        return "This email is already registered. Please login.";
      }


      if (msg.includes("email not confirmed")) {
        return "Please verify your email before logging in.";
      }


      if (msg.includes("password")) {
        return error;
      }


      if (msg.includes("email")) {
        return error;
      }


      return error;
    }


    /* =========================================
       START
    ========================================= */

    landingPage();

  </script>

</body>
</html>
