<!DOCTYPE html>

<title>PTUT Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--g:#0d5c36;--g2:#2d712f;--gs:#e4f1e8;--r:#eb2024;--rs:#fde8e8;--b:#2457c5;--bs:#e6edfb;--ink:#0f1a14;--mut:#5d6b62;--bg:#f3f5f2;--c:#fff;--ln:#e1e6e2;--sh:0 1px 2px rgba(15,26,20,.06),0 8px 24px rgba(15,26,20,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#3fb877;--gs:#173223;--rs:#3a1719;--bs:#17233f;--ink:#eef3ef;--mut:#9fb0a5;--bg:#0e1411;--c:#161e19;--ln:#25302a;--r:#ff5a5e;--b:#7fa6ff}}
:root[data-theme="dark"]{--g:#3fb877;--gs:#173223;--rs:#3a1719;--bs:#17233f;--ink:#eef3ef;--mut:#9fb0a5;--bg:#0e1411;--c:#161e19;--ln:#25302a;--r:#ff5a5e;--b:#7fa6ff}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
h1,h2,h3,p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--ln);background:var(--c);font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}
.btn.d{color:var(--r);border-color:var(--rs)}
.btn.g{border-color:transparent;background:none}
.btn.ld{pointer-events:none;opacity:.8}.btn.ld::after{content:"";width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.card{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--gs);color:var(--g)}
.badge.r{background:var(--rs);color:var(--r)}.badge.b{background:var(--bs);color:var(--b)}
.mut{color:var(--mut)}.sm{font-size:13px}
input,select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--ln);border-radius:12px;background:var(--c)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--c);font:inherit;color:inherit;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--c);font-weight:600;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200% 100%;animation:sk 1.1s infinite;height:84px;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.view{animation:in .35s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(8px)}}
/* landing */
.nav{display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:0 auto;padding:16px 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;box-shadow:inset 0 -3px 0 var(--r)}
.hero{max-width:1120px;margin:0 auto;padding:40px 20px 60px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.02;letter-spacing:-.03em;font-weight:800}
.hero h1 em{font-style:normal;color:var(--g)}
.hero p.lead{font-size:18px;color:var(--mut);margin:18px 0 26px;max-width:46ch}
.mock{position:relative;animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}
.win{border-radius:18px;border:1px solid var(--ln);background:var(--c);box-shadow:0 30px 60px rgba(13,92,54,.18);overflow:hidden}
.win .tb{display:flex;gap:6px;padding:10px 14px;background:var(--bg)}.win .tb s{width:10px;height:10px;border-radius:50%;background:var(--ln)}
.fc{position:absolute;padding:10px 14px;border-radius:14px;background:var(--c);border:1px solid var(--ln);box-shadow:var(--sh);font-size:13px;font-weight:700}
.sec{max-width:1120px;margin:0 auto;padding:40px 20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--g)}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .side{background:linear-gradient(160deg,var(--g),#07341f);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth .form{display:grid;place-items:center;padding:24px}.auth .form>div{width:100%;max-width:380px}
.err{color:var(--r);font-size:13px;margin-top:6px;min-height:18px}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side-n{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--ln);background:var(--c);display:flex;flex-direction:column;gap:4px}
.side-n a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font-weight:600;color:var(--mut);transition:background .15s,transform .15s}
.side-n a:hover{background:var(--bg);transform:translateX(2px)}
.side-n a.on{background:var(--gs);color:var(--g)}
.top{display:flex;align-items:center;gap:10px;padding:14px 24px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px)}
.srch{flex:1;max-width:420px;justify-content:flex-start;color:var(--mut)}
.srch kbd{margin-left:auto;font:600 12px inherit;border:1px solid var(--ln);border-radius:6px;padding:1px 6px}
.dot{position:relative}.dot b{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--r);color:#fff;font-size:11px;display:grid;place-items:center;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.av{width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}
main{padding:8px 24px 100px;max-width:1080px;width:100%}
.pg{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:8px 0 18px;flex-wrap:wrap}
.pg h1{font-size:28px;letter-spacing:-.02em}
.hcard{background:linear-gradient(135deg,var(--g),#0a4228);color:#fff;border:0}
.hcard .bar{background:rgba(255,255,255,.25)}.hcard .bar i{background:#fff}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.tl{display:flex;flex-direction:column;gap:10px}
.cl{display:flex;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--c);cursor:pointer;border-left:5px solid var(--cc);transition:transform .15s,box-shadow .15s;width:100%;text-align:left}
.cl:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.cl .t{width:64px;flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.cl.done{opacity:.55}.cl.now{background:var(--gs);box-shadow:0 0 0 2px var(--g)}.cl.x{background:repeating-linear-gradient(45deg,var(--rs),var(--rs) 8px,var(--c) 8px,var(--c) 16px)}
.brk{text-align:center;color:var(--mut);font-size:13px;padding:2px}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.wk h3{font-size:14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--c);margin-bottom:10px}
.row.dn{opacity:.6}.row.dn b{text-decoration:line-through}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);background:none;display:grid;place-items:center;cursor:pointer;flex:none;transition:all .2s}
.ck.on{background:var(--g);border-color:var(--g);color:#fff;animation:pop .3s}
.imp{border-left:5px solid var(--r)}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}.empty .ei{font-size:40px}
.bn{display:none}
.ov{position:fixed;inset:0;background:rgba(5,15,10,.5);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.md{width:100%;max-width:460px;max-height:86vh;overflow:auto;animation:in .3s}
.dr{place-items:stretch end;padding:0}.dr .md{max-width:380px;max-height:none;height:100%;border-radius:18px 0 0 18px;animation:sl .3s}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.pal{align-self:start;margin-top:12vh;max-width:560px}
.pal .it{display:flex;gap:10px;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;background:none;border-radius:10px;text-align:left;cursor:pointer}
.pal .it:hover,.pal .it:focus{background:var(--gs)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;animation:in .3s}
.off{background:var(--ink);color:var(--bg);text-align:center;padding:8px;font-size:14px;font-weight:600}
.tg{width:48px;height:28px;border-radius:99px;border:0;background:var(--ln);position:relative;cursor:pointer;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}.tg[aria-checked=true]{background:var(--g)}.tg[aria-checked=true]::after{transform:translateX(20px)}
.cols{display:flex;align-items:end;gap:10px;height:140px}.cols i{flex:1;background:linear-gradient(var(--g2),var(--g));border-radius:8px 8px 0 0;position:relative;transition:height .8s}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);font-size:14px}
.mom{background:#07271c;color:#fff;margin:20px 0}
.mg{max-width:1120px;margin:0 auto;padding:64px 20px;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.mom h2{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:20px 0}
.ml{font-size:18px;color:#b9cfc4;max-width:46ch;margin-bottom:24px}
.mk{list-style:none;padding:0;margin:0 0 30px;display:grid;gap:14px;font-size:17px}
.mk li{display:flex;gap:14px;align-items:center}.mk .ic{color:#5fd3a0}
.phw{position:relative;display:flex;justify-content:center;padding:10px 0}
.ph{width:290px;background:#111815;border-radius:46px;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.5);animation:fl 7s ease-in-out infinite}
.sc{background:#f4f6f3;color:#0f1a14;border-radius:36px;padding:14px 16px 12px}
.sb{font-size:12px;font-weight:700;color:#fff;background:#111815;margin:-14px -16px 14px;padding:12px 24px 8px;border-radius:30px 30px 0 0}
.gm{font-size:10px;letter-spacing:.12em;color:#6b776f}.nm{font-size:22px;margin:2px 0 12px}
.nowc{background:#0d5c36;color:#fff;border-radius:18px;padding:14px}.nowc b{display:block;font-size:16px;margin:6px 0 2px}.nowc small{opacity:.85}
.np{font-size:10px;letter-spacing:.12em;opacity:.8}
.pb{height:6px;border-radius:6px;background:rgba(255,255,255,.3);margin-top:12px}.pb i{display:block;width:62%;height:100%;border-radius:6px;background:#3fd18c}
.dr2{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e1e6e2;font-size:12px}.dr2>span{width:34px;font-weight:700}.dr2>i{width:7px;height:7px;border-radius:50%;background:#1f9d63;flex:none}.dr2 small{display:block;color:#6b776f;font-size:10px}
.pn{display:flex;justify-content:space-around;padding-top:12px}.pn .ic{width:22px;height:22px}
.fl1,.fl2{position:absolute;display:flex;gap:12px;align-items:center;background:#fff;color:#0f1a14;padding:12px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-size:13px}
.fl1 small,.fl2 small{display:block;color:#4b5850}.fl1{top:60px;right:-10px}.fl2{bottom:70px;left:-10px}
@media (max-width:900px){
 .mg{grid-template-columns:1fr;padding:44px 20px}.fl1{right:0}.fl2{left:0}
 .hero,.auth,.two{grid-template-columns:1fr}.auth .side{display:none}.grid3{grid-template-columns:1fr}
 .shell{display:block}.side-n{display:none}.top{padding:12px 16px}main{padding:4px 16px 110px}
 .srch span,.srch kbd{display:none}.srch{flex:none;width:44px;padding:0;justify-content:center}.spc{flex:1}
 .wk{grid-template-columns:1fr}
 .bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--c);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 .bn a,.bn button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;border:0;background:none;font-size:11px;font-weight:700;color:var(--mut);justify-content:center;cursor:pointer}
 .bn .on{color:var(--g)}
 .toast{bottom:100px}
}
.ob{min-height:100vh;padding:0 16px 40px;background:var(--bg)}
.ob header{max-width:1000px;margin:0 auto;height:72px;display:flex;align-items:center;justify-content:space-between}
.stp{max-width:680px;margin:10px auto 36px;display:flex;justify-content:space-between;position:relative}
.stp::before{content:"";position:absolute;top:16px;left:8%;right:8%;height:2px;background:var(--ln)}
.sd{position:relative;text-align:center;font-size:12px;color:var(--mut);flex:1}
.sd i{width:32px;height:32px;border-radius:50%;background:var(--c);border:2px solid var(--ln);display:grid;place-items:center;margin:0 auto 6px;font-style:normal;font-weight:700;transition:all .3s}
.sd.on{color:var(--g);font-weight:700}.sd.on i{background:var(--g);border-color:var(--g);color:#fff}.sd i .ic{width:16px;height:16px}
.obc{max-width:520px;margin:0 auto;padding:32px}
.ol{display:grid;gap:8px;margin-top:14px}.ol.g2{grid-template-columns:1fr 1fr}
.op{min-height:52px;border:1px solid var(--ln);background:var(--c);border-radius:12px;padding:0 14px;text-align:left;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .15s}
.op[aria-pressed=true]{border-color:var(--g);background:var(--gs);color:var(--g)}
.oa{display:flex;justify-content:space-between;margin-top:26px}
.sum{display:grid;margin:18px 0}.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}
button:disabled{opacity:.4;cursor:default}
@media (max-width:600px){.sd span{display:none}.obc{padding:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 return'<div class="pg"><div><h1>CR dashboard</h1><p class="mut">BSCS · Semester 3 · Section A · 42 students</p></div><span class="badge">Class Representative</span></div><div class="two"><div class="card" style="align-self:start"><h3>Post to your section</h3><label for="crt">Title</label><input id="crt" maxlength="80"><label for="crm">Message</label><textarea id="crm"></textarea><label for="cra">Audience</label><select id="cra" disabled><option>BSCS Section A only (42 students)</option></select><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="cri" style="width:22px;min-height:22px">Mark as important</label><p class="err" id="cre" role="alert"></p><button class="btn p" id="crp" style="width:100%">Publish to section</button></div><div><div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:10px">Live preview</h3><div id="pv">'+prev()+'</div></div><div class="card"><h3>CR permissions</h3><p class="sm" style="margin:10px 0"><span class="badge">Allowed</span> Post section announcements, view the section timetable, share class updates</p><p class="sm"><span class="badge r">Admin only</span> University or department posts, editing the official timetable, managing students</p></div></div></div><h2 style="font-size:18px;margin:8px 0 12px">Your posts</h2>'+(mine||'<div class="empty"><div class="ei">📣</div><b>No posts yet.</b><p>Share an update with your section.</p></div>')+'<h2 style="font-size:18px;margin:20px 0 12px">Section timetable today</h2>'+dayList(clock().d,clock())}
function nf404(){return'<div class="empty view" style="min-height:70vh;display:grid;place-content:center"><div class="ei">🧭</div><h1>404</h1><p>This page doesn\'t exist.</p><p><a class="btn p" href="#/">Go home</a></p></div>'}

/* ---------- shell + router ---------- */
var V={cr:cr,home:home,timetable:timetable,tasks:tasks,exams:exams,news:news,settings:settings,admin:admin};
function shell(p){var un=S.notes.filter(function(n){return n.u}).length;
 return'<div class="shell"><nav class="side-n" aria-label="Main"><div style="padding:6px 8px 16px">'+LOGO+'</div>'+NAV.map(function(n){return'<a href="#/app/'+n[0]+'"'+(p===n[0]?' class="on" aria-current="page"':"")+'>'+ic(n[2])+n[1]+'</a>'}).join("")+'</nav><div><header class="top"><button class="btn srch" id="sb" aria-label="Search">'+ic("sr")+'<span>Search classes, tasks…</span><kbd>Ctrl K</kbd></button><span class="spc"></span><button class="btn dot" id="bl" aria-label="Notifications">'+ic("bell")+(un?'<b>'+un+'</b>':"")+'</button><div class="av" aria-label="Profile">F</div></header><main id="mn" aria-live="polite"></main></div></div>'+
 '<nav class="bn" aria-label="Mobile">'+[["home","Home","home"],["timetable","Timetable","cal"],["tasks","Tasks","chk"],["exams","Exams","ex"]].map(function(n){return'<a href="#/app/'+n[0]+'"'+(p===n[0]?' class="on"':"")+'>'+ic(n[2])+n[1]+'</a>'}).join("")+'<button id="more">'+ic("mo")+'More</button></nav>'}
function sk(){return'<div class="sk"></div><div class="sk" style="height:140px"></div><div class="sk"></div>'}
function route(){closeM();var h=location.hash.replace(/^#\/?/,""),q=h.split("?"),pa=q[0],a=$("#app");
 if(pa===""||pa==="why"){a.innerHTML=landing();return}
 if(pa==="login"){var su=q[1]==="s=1";a.innerHTML=auth(su);authInit(su);return}
 if(pa==="onboarding"){a.innerHTML=onb();return}
 var m=pa.match(/^app\/(\w+)$/);if(!m||!V[m[1]]){a.innerHTML=nf404();return}
 var p=m[1];a.innerHTML=shell(p);var mn=$("#mn");mn.innerHTML=sk();setTimeout(function(){mn.innerHTML='<div class="view">'+V[p]()+'</div>'},350);
 $("#sb").onclick=pal;$("#bl").onclick=notes;$("#more").onclick=function(){openM('<h3 style="margin-bottom:10px">More</h3>'+[["news","Announcements","ann"],["settings","Settings","set"],["cr","CR Dashboard","ad"],["admin","Admin","ad"]].map(function(n){return'<a class="btn" style="width:100%;justify-content:flex-start;margin-bottom:8px" href="#/app/'+n[0]+'">'+ic(n[2])+n[1]+'</a>'}).join('')+'<button class="btn" id="nb2" style="width:100%;justify-content:flex-start">'+ic("bell")+'Notifications</button>');$("#nb2").onclick=notes}}
function notes(){openM('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>Notifications</h3><button class="btn g" id="mr">Mark all as read</button></div>'+S.notes.map(function(n){return'<div class="row" style="'+(n.u?"background:var(--gs)":"")+'">'+(n.u?'<span class="badge">New</span>':"")+'<span style="flex:1">'+n.t+'</span></div>'}).join(""),"dr");$("#mr").onclick=function(){S.notes.forEach(function(n){n.u=0});closeM();route();toast("All caught up")}}
function pal(){var ix=[];CL.forEach(function(c){ix.push(["Class",c.n+" · "+c.t+" · "+c.r,"timetable"])});S.tasks.forEach(function(t){ix.push(["Task",t.n,"tasks"])});EX.forEach(function(e){ix.push(["Exam",e.n,"exams"])});NW.forEach(function(n){ix.push(["News",n.t,"news"])});
 openM('<input id="q" placeholder="Search subjects, teachers, rooms, tasks…" aria-label="Search"><div id="rs" style="margin-top:10px"></div>',"pal");
 function r(){var v=$("#q").value.toLowerCase(),L=ix.filter(function(i){return!v||i[1].toLowerCase().indexOf(v)>-1}).slice(0,8);$("#rs").innerHTML=L.length?L.map(function(i){return'<a class="it" href="#/app/'+i[2]+'"><span class="badge b">'+i[0]+'</span>'+esc(i[1])+'</a>'}).join(""):'<div class="empty">No results found.</div>'}
 $("#q").oninput=r;r()}
document.addEventListener("click",function(e){var t=e.target.closest("button,a");if(!t)return;var d=t.dataset,mn=$("#mn");
 function re(){mn.innerHTML='<div class="view">'+V[location.hash.replace(/^#\/app\//,"")]()+'</div>'}
 if(d.cl!==undefined){var c=CL[d.cl];openM('<span class="badge" style="background:'+c.c+';color:#fff">'+(c.x?"Cancelled":DN[c.d])+'</span><h2 style="margin:10px 0">'+c.n+'</h2><p class="mut">'+c.t+'<br>'+c.r+'<br>'+tm(c.s)+' – '+tm(c.e)+'<br>BSCS · Semester 3 · Section A</p><button class="btn p" style="margin-top:14px;width:100%" onclick="closeM()">Close</button>')}
 else if(d.mode){S.mode=d.mode;re()}else if(d.day){S.day=+d.day;re()}else if(d.today){S.day=clock().d;re()}
 else if(d.tf){S.tf=d.tf;re()}else if(d.nf){S.nfc=d.nf;re()}else if(d.th){theme(d.th);re()}
 else if(d.ck){var k=S.tasks.filter(function(x){return x.id==d.ck})[0];k.done=!k.done;k.p=k.done?100:k.p===100?80:k.p;save();re();if(k.done)toast("Task completed 🎉")}
 else if(d.del){S.tasks=S.tasks.filter(function(x){return x.id!=d.del});save();re();toast("Task deleted")}
 else if(d.nf2){S.nf[d.nf2]=!S.nf[d.nf2];save();re()}
 else if(d.more){var p=t.parentNode.querySelector("p");p.hidden=!p.hidden;t.textContent=p.hidden?"Read more":"Show less"}
 else if(d.ob){var op=d.ob.split("|");S.ob[op[0]]=op[1];$("#app").innerHTML=onb()}
 else if(d.obn){if(OS===0){var nv=$("#obn").value.trim();if(!nv){$("#obe").textContent="Enter your name.";return}S.ob.name=nv}OS++;$("#app").innerHTML=onb()}
 else if(d.obb){if(OS>0)OS--;$("#app").innerHTML=onb()}
 else if(d.obd){save();toast("Welcome to PTUT Hub!");location.hash="#/app/home"}
 else if(t.id==="crp"){var ti=$("#crt").value.trim(),ms=$("#crm").value.trim();if(!ti||!ms){$("#cre").textContent="Add a title and a message.";return}NW.unshift({t:ti,a:"Fazeel (CR, BSCS 3A)",d:"Just now",cat:"Section",imp:$("#cri").checked?1:0,cr:1,x:ms});S.notes.unshift({t:"New announcement: "+ti,u:1});toast("Posted to BSCS Section A");route()}
 else if(d.crdel){NW.splice(+d.crdel,1);re();toast("Post deleted")}
 else if(d.pub){toast(d.pub+" timetable published");t.closest("tr").querySelector(".badge").textContent="Published";t.remove()}
 else if(t.id==="offp"){$("#off").hidden=!$("#off").hidden}
 else if(t.id==="nt"){openM('<h3>Add task</h3><label for="tn">Title</label><input id="tn"><label for="ts">Subject</label><select id="ts">'+Object.keys(SUB).map(function(s){return'<option>'+s+'</option>'}).join("")+'</select><label for="tp">Priority</label><select id="tp"><option>High</option><option selected>Medium</option><option>Low</option></select><label for="td">Due in (days)</label><input id="td" type="number" min="0" value="2"><p class="err" id="te"></p><button class="btn p" id="sv" style="width:100%">Save task</button>');
  $("#sv").onclick=function(){var n=$("#tn").value.trim();if(!n){$("#te").textContent="Enter a task title.";return}S.tasks.push({id:Date.now(),n:n,sub:$("#ts").value,pri:$("#tp").value,cat:"Assignment",off:+$("#td").value||0,p:0,done:0});save();closeM();re();toast("Task added")}}});
document.addEventListener("input",function(e){if(/^cr[tmi]$/.test(e.target.id)){$("#pv").innerHTML=prev()}var i=e.target.dataset.pr;if(i!==undefined){EX[i].p=+e.target.value;e.target.previousElementSibling.textContent="Preparation: "+e.target.value+"%"}});
window.addEventListener("hashchange",route);route();
</script>
